# Planner: story refinement (wf-plan). Never invents requirements: missing or untestable AC → ask the PO.
id: planner
agent: planner
inputs:
  - {type: story}
  - {type: topic-prd, optional: true}
  - {type: split-ref, optional: true}
rework_inputs:
  - {type: proposal-feedback, scope: story}
outputs:
  - {type: explore, required_sections: [Affected repos, Reuse, Risks]}
  - type: proposal
    scope: repo
    multiple: true
    required_sections: [Summary, Interfaces & test hooks, Sensitive changes, Tasks]
workdir: workspace
write_allow: []
tools: [read, search, ask_human]
gate: proposal_approval
